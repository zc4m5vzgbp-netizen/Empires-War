name: Renderizar arte de 0 A.D.

# Renderiza con Blender (Cycles, CPU) las unidades y edificios de scripts/art/zeroad-config.json a partir del
# repositorio de 0 A.D. (arte CC-BY-SA 3.0, Wildfire Games) y deja las imágenes en la rama «renders-0ad».
on:
  workflow_dispatch:
  push:
    branches: [feat/military-art]
    paths: [scripts/art/zeroad.py, scripts/art/zeroad-config.json, .github/workflows/render-0ad.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Blender 4.2 LTS (incluye el importador COLLADA)
        run: |
          V=$(curl -s https://download.blender.org/release/Blender4.2/ | grep -o 'blender-4\.2\.[0-9]*-linux-x64\.tar\.xz' | sort -V | tail -1)
          echo "Descargando $V"
          curl -sL "https://download.blender.org/release/Blender4.2/$V" | tar xJ
          mv blender-4.2.*-linux-x64 blender
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 > /dev/null
          ./blender/blender --version | head -1

      - name: Ficheros de 0 A.D. (clon parcial, solo lo necesario)
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/0ad/0ad.git zeroad
          echo "0ad@$(git -C zeroad rev-parse HEAD)" > zeroad-commit.txt
          python3 scripts/art/zeroad.py fetch zeroad scripts/art/zeroad-config.json | head -5

      - name: Renderizar
        run: ./blender/blender -b --factory-startup -P scripts/art/zeroad.py -- render zeroad scripts/art/zeroad-config.json renders 2>&1 | grep -v "^Fra:\|^ Time\|Saved:" | tail -40

      - name: Publicar en la rama «renders-0ad»
        run: |
          cp zeroad-commit.txt renders/
          cp zeroad/binaries/data/mods/public/art/LICENSE.txt renders/LICENSE-0AD.txt
          cd renders
          echo "::notice title=Renders::$(find . -name '*.png' | wc -l) imágenes"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Renders de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/renders-0ad
