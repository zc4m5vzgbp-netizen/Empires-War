name: Generar package-lock.json

# La sesión de Claude no tiene acceso al registro npm; el archivo de bloqueo se genera aquí.
on:
  workflow_dispatch:
  push:
    paths: [package.json]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolver dependencias sin instalarlas
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Subir package-lock.json si cambió
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Actualizar package-lock.json (generado en GitHub Actions)"
            git push
            echo "::notice title=package-lock.json::Generado y subido ($(wc -c < package-lock.json) bytes)"
          else
            echo "::notice title=package-lock.json::Sin cambios"
          fi
