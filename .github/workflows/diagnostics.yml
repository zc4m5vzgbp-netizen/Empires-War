name: Diagnóstico de rendimiento

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: FPS por etapa
        run: |
          npx playwright install --with-deps chromium webkit
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/Empires-War/ > /dev/null && break; sleep 1; done
          node scripts/perf-probe.mjs
          if [ -f scripts/perf-audit.mjs ]; then node scripts/perf-audit.mjs; fi
